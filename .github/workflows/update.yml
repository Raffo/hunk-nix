name: Auto-update to latest release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hunk
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test updater
        run: bash tests/update.sh

      - name: Update release pins
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash update.sh
          if git diff --quiet -- sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -er .version sources.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.update.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Build and check package
        if: steps.update.outputs.changed == 'true'
        run: nix-build --no-out-link

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "Update hunk to v$VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
